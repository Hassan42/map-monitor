spring.application.name=map-monitor

spring.datasource.url=jdbc:postgresql://localhost:5433/mapmonitor
spring.datasource.username=myuser
spring.datasource.password=mypassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

firebase.service-account-path=classpath:firebase-service-account.json

# the frontend addresses allowed to call the API: Vite dev server, vite preview (production build)
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# requests per minute, per person
app.rate-limit.visitor=120
app.rate-limit.user=300
